<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Студия перманентного макияжа — панель мастера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Work Sans', sans-serif; background: #FAF7F5; color: #2E2024; }
  #app { max-width: 780px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; margin: 0; }
  .subtitle { margin: 4px 0 0; color: #8A7570; font-size: 14px; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .client-link-box { background: #fff; border: 1px solid #E7DEDA; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; color: #8A7570; max-width: 260px; }
  .client-link-box a { color: #8C3B4A; font-weight: 500; word-break: break-all; }
  .tabs { display: flex; gap: 24px; border-bottom: 1px solid #E7DEDA; margin: 24px 0; overflow-x: auto; }
  .tab-btn { background: none; border: none; padding: 10px 2px; font-size: 14.5px; color: #8A7570; border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; font-family: 'Work Sans', sans-serif; }
  .tab-btn.active { color: #8C3B4A; font-weight: 500; border-bottom-color: #8C3B4A; }
  .date-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .date-human { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; text-transform: capitalize; }
  .icon-btn, .link-btn { border: 1px solid #E7DEDA; background: #fff; border-radius: 6px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; }
  .link-btn { width: auto; border: none; background: none; color: #8C3B4A; font-weight: 500; font-size: 13px; padding: 4px 6px; }
  input[type="date"] { border: 1px solid #E7DEDA; border-radius: 6px; padding: 5px 8px; font-size: 13px; color: #8A7570; background: #fff; }
  .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card { flex: 1; background: #fff; border: 1px solid #E7DEDA; border-radius: 8px; padding: 12px 16px; }
  .stat-label { font-size: 12.5px; color: #8A7570; }
  .stat-value { font-size: 20px; font-weight: 500; margin-top: 4px; font-family: 'Fraunces', serif; }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: #8C3B4A; color: #fff; border: none; border-radius: 7px; padding: 10px 18px; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-secondary { background: none; border: 1px solid #E7DEDA; color: #5F5450; border-radius: 7px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  .form-card { background: #fff; border: 1px solid #E7DEDA; border-radius: 10px; padding: 20px; margin-top: 14px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .wide { grid-column: 1 / -1; }
  label.field-label { display: block; font-size: 12.5px; color: #8A7570; margin-bottom: 5px; }
  input[type="text"], input[type="tel"], input[type="time"], input[type="number"], select, textarea {
    width: 100%; border: 1px solid #E7DEDA; border-radius: 6px; padding: 9px 10px; font-size: 14px; background: #FDFBFA; color: #2E2024; font-family: 'Work Sans', sans-serif;
  }
  textarea { min-height: 60px; resize: vertical; }
  .error-text { color: #A3402E; font-size: 13px; margin-top: 12px; }
  .form-actions { display: flex; gap: 10px; margin-top: 16px; }
  .empty-state { border: 1px dashed #E7DEDA; border-radius: 10px; padding: 36px 20px; text-align: center; }
  .empty-title { font-family: 'Fraunces', serif; font-size: 17px; margin: 0 0 4px; }
  .empty-body { color: #8A7570; font-size: 13.5px; margin: 0; }
  .appt-row, .service-row { display: flex; gap: 14px; padding: 14px 16px; background: #fff; border: 1px solid #EFE7E3; border-left-width: 3px; margin-top: -1px; }
  .appt-time { width: 56px; font-size: 13.5px; color: #5F5450; padding-top: 2px; flex-shrink: 0; }
  .appt-main { flex: 1; min-width: 0; }
  .appt-client { font-size: 15px; font-weight: 500; }
  .appt-detail { font-size: 13.5px; color: #5F5450; margin-top: 2px; }
  .appt-detail-muted { font-size: 12.5px; color: #8A7570; margin-top: 3px; }
  .appt-notes { font-size: 12.5px; color: #8A7570; margin-top: 6px; font-style: italic; }
  .appt-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .status-pill { font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .status-pill.new { animation: pulse-new 1.6s ease-in-out 2; }
  @keyframes pulse-new { 0%, 100% { box-shadow: 0 0 0 0 rgba(140,59,74,0.35); } 50% { box-shadow: 0 0 0 4px rgba(140,59,74,0.15); } }
  .appt-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .text-action { background: none; border: none; color: #8A7570; font-size: 12px; cursor: pointer; padding: 2px 4px; font-family: 'Work Sans', sans-serif; }
  .text-action:hover { color: #2E2024; }
  .client-card { background: #fff; border: 1px solid #EFE7E3; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .client-header { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: none; border: none; cursor: pointer; text-align: left; font-family: 'Work Sans', sans-serif; }
  .client-avatar { width: 36px; height: 36px; border-radius: 50%; background: #F3DFE1; color: #8C3B4A; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-weight: 500; font-size: 15px; flex-shrink: 0; }
  .client-name { font-size: 15px; font-weight: 500; }
  .client-revenue { font-size: 14px; font-weight: 500; margin-right: 4px; }
  .client-history { border-top: 1px solid #EFE7E3; padding: 6px 16px 12px; }
  .history-row { padding: 10px 0; border-bottom: 1px solid #F5EFEC; }
  .history-date { font-size: 12.5px; color: #8A7570; }
  .history-service { font-size: 14px; margin-top: 2px; }
  .service-price { font-size: 15px; font-weight: 500; }
  .setup-banner { background: #FBEAF0; border: 1px solid #F0C7D3; color: #72243E; border-radius: 8px; padding: 14px 16px; font-size: 13.5px; margin-bottom: 20px; }
  .setup-banner code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 4px; }
  .reminder-banner { background: #FFF6E8; border: 1px solid #F0DCAE; border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; }
  .reminder-title { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; color: #8A5A1E; margin: 0 0 10px; }
  .reminder-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #F0DCAE; }
  .reminder-row:first-of-type { border-top: none; }
  .reminder-main { flex: 1; min-width: 0; font-size: 13.5px; }
  .reminder-main b { font-weight: 500; }
  .reminder-sub { font-size: 12px; color: #8A7570; margin-top: 1px; }
  .reminder-dismiss { background: none; border: 1px solid #E7DEDA; color: #5F5450; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; font-family: 'Work Sans', sans-serif; }
  .reminder-date-input { border: 1px solid #E7DEDA; border-radius: 6px; padding: 9px 10px; font-size: 14px; background: #FDFBFA; color: #2E2024; font-family: 'Work Sans', sans-serif; width: 100%; }
  ::placeholder { color: #B3A29C; }
  @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } .appt-row, .service-row { flex-wrap: wrap; } }
</style>
</head>
<body>
<div id="app"><p style="text-align:center; color:#8A7570; padding:60px 0; font-family:'Work Sans',sans-serif;">Загрузка…</p></div>

<script>
/* =======================================================================
   НАСТРОЙКА FIREBASE — вставьте сюда свои данные из консоли Firebase
   (Project settings → General → Your apps → SDK setup and configuration)
   ======================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyAt0TRdJbH-O3pM84fSRuqW56ajvrvFCsw",
  authDomain: "pmu-booking-ba795.firebaseapp.com",
  projectId: "pmu-booking-ba795",
  storageBucket: "pmu-booking-ba795.firebasestorage.app",
  messagingSenderId: "1072435451685",
  appId: "1:1072435451685:web:4f37701272cd95b767accc"
};
/* Ссылка на страницу для клиентов — впишите после публикации book.html */
const CLIENT_BOOKING_URL = "https://nikitakon.github.io/pmu-booking/book.html";
/* ======================================================================= */

const CONFIG_IS_SET = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("ВАШ_") === -1;
let db = null;
if (CONFIG_IS_SET) {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}

/* ---------- helpers ---------- */
function todayStr() {
  const d = new Date();
  const off = d.getTimezoneOffset();
  return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
}
function addDaysStr(dateStr, delta) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.toISOString().slice(0, 10);
}
function formatDateHuman(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
}
function formatMoney(n) { return (Number(n) || 0).toLocaleString('ru-RU') + ' грн'; }
function esc(s) { const d = document.createElement('div'); d.innerText = s == null ? '' : s; return d.innerHTML; }

const STATUS_META = {
  planned: { label: 'Запланировано', color: '#8C3B4A', bg: '#F3DFE1' },
  done: { label: 'Выполнено', color: '#3F6B4C', bg: '#E1EBE3' },
  cancelled: { label: 'Отменено', color: '#8A7570', bg: '#EFE9E6' },
};

/* ---------- state ---------- */
let state = {
  tab: 'today',
  services: [],
  appointments: [],
  selectedDate: todayStr(),
  showAddForm: false,
  editingApptId: null,
  expandedClientKey: null,
  showServiceForm: false,
  editingServiceId: null,
};

/* ---------- Firestore live sync ---------- */
if (db) {
  db.collection('services').orderBy('name').onSnapshot(snap => {
    state.services = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => console.error('services sync error', err));

  db.collection('appointments').onSnapshot(snap => {
    state.appointments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => console.error('appointments sync error', err));
}

/* ---------- derived data ---------- */
function getDayAppointments() {
  return state.appointments.filter(a => a.date === state.selectedDate).sort((a, b) => a.time.localeCompare(b.time));
}
function getDayRevenue(list) {
  return list.filter(a => a.status !== 'cancelled').reduce((sum, a) => {
    const svc = state.services.find(s => s.id === a.serviceId);
    return sum + (svc ? Number(svc.price) || 0 : 0);
  }, 0);
}
function getTodayReminders() {
  const today = todayStr();
  return state.appointments
    .filter(a => a.reminderDate === today && a.status !== 'cancelled')
    .sort((a, b) => a.time.localeCompare(b.time));
}
function getClients() {
  const map = new Map();
  for (const a of state.appointments) {
    const key = (a.phone || '').trim() || (a.clientName || '').trim().toLowerCase();
    if (!map.has(key)) map.set(key, { key, name: a.clientName, phone: a.phone, visits: [] });
    map.get(key).visits.push(a);
  }
  return Array.from(map.values()).map(c => {
    const sorted = [...c.visits].sort((a, b) => b.date === a.date ? b.time.localeCompare(a.time) : b.date.localeCompare(a.date));
    const revenue = c.visits.filter(v => v.status === 'done').reduce((sum, v) => {
      const svc = state.services.find(s => s.id === v.serviceId);
      return sum + (svc ? Number(svc.price) || 0 : 0);
    }, 0);
    return { ...c, visits: sorted, lastVisit: sorted[0], revenue };
  }).sort((a, b) => b.lastVisit.date.localeCompare(a.lastVisit.date));
}

/* ---------- render ---------- */
function render() {
  const app = document.getElementById('app');
  if (!CONFIG_IS_SET) {
    app.innerHTML = `
      <header><h1>Студия перманентного макияжа</h1><p class="subtitle">Панель мастера</p></header>
      <div class="setup-banner">
        Firebase ещё не подключён. Откройте файл <code>index.html</code>, найдите блок
        <code>firebaseConfig</code> в начале &lt;script&gt; и вставьте туда данные вашего проекта из консоли Firebase.
      </div>`;
    return;
  }
  app.innerHTML = `
    <div class="header-row">
      <header><h1>Студия перманентного макияжа</h1><p class="subtitle">Записи и клиенты</p></header>
      <div class="client-link-box">Ссылка для клиентов:<br><a href="${esc(CLIENT_BOOKING_URL)}" target="_blank">${esc(CLIENT_BOOKING_URL)}</a></div>
    </div>
    <nav class="tabs">
      <button class="tab-btn ${state.tab === 'today' ? 'active' : ''}" data-action="tab" data-tab="today">Сегодня</button>
      <button class="tab-btn ${state.tab === 'clients' ? 'active' : ''}" data-action="tab" data-tab="clients">Клиенты</button>
      <button class="tab-btn ${state.tab === 'services' ? 'active' : ''}" data-action="tab" data-tab="services">Услуги и цены</button>
    </nav>
    ${renderReminders()}
    <main>${state.tab === 'today' ? renderToday() : state.tab === 'clients' ? renderClients() : renderServices()}</main>
  `;
  attachListeners();
}

function renderReminders() {
  const reminders = getTodayReminders();
  if (reminders.length === 0) return '';
  return `
    <div class="reminder-banner">
      <p class="reminder-title">🔔 Напомнить сегодня (${reminders.length})</p>
      ${reminders.map(a => {
        const svc = state.services.find(s => s.id === a.serviceId);
        return `
          <div class="reminder-row">
            <div class="reminder-main">
              <b>${esc(a.clientName)}</b>${a.phone ? ' · ' + esc(a.phone) : ''}
              <div class="reminder-sub">Запись: ${esc(new Date(a.date + 'T00:00:00').toLocaleDateString('ru-RU'))} в ${esc(a.time)}${svc ? ' · ' + esc(svc.name) : ''}</div>
            </div>
            <button class="reminder-dismiss" data-action="dismiss-reminder" data-id="${a.id}">Напомнил(а)</button>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderToday() {
  const dayAppts = getDayAppointments();
  const revenue = getDayRevenue(dayAppts);
  return `
    <div class="date-nav">
      <button class="icon-btn" data-action="prev-day" aria-label="Предыдущий день">‹</button>
      <div style="flex:1; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;">
        <div class="date-human">${esc(formatDateHuman(state.selectedDate))}</div>
        <input type="date" id="date-picker" value="${state.selectedDate}" />
      </div>
      <button class="icon-btn" data-action="next-day" aria-label="Следующий день">›</button>
      <button class="link-btn" data-action="today">Сегодня</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Записей</div><div class="stat-value">${dayAppts.length}</div></div>
      <div class="stat-card"><div class="stat-label">Ожидаемый доход</div><div class="stat-value">${formatMoney(revenue)}</div></div>
    </div>
    ${(!state.showAddForm && !state.editingApptId) ? `<button class="btn-primary" data-action="show-add-appt">+ Новая запись</button>` : ''}
    ${(state.showAddForm || state.editingApptId) ? renderApptForm() : ''}
    <div style="margin-top:20px;">
      ${dayAppts.length === 0 && !state.showAddForm ? `
        <div class="empty-state"><p class="empty-title">На этот день записей нет</p><p class="empty-body">Добавьте запись сами или дождитесь заявки от клиента по вашей ссылке.</p></div>`
        : dayAppts.map(renderApptRow).join('')}
    </div>
  `;
}

function renderApptRow(a) {
  const svc = state.services.find(s => s.id === a.serviceId);
  const meta = STATUS_META[a.status] || STATUS_META.planned;
  return `
    <div class="appt-row" style="border-left-color:${meta.color};">
      <div class="appt-time">${esc(a.time)}</div>
      <div class="appt-main">
        <div class="appt-client">${esc(a.clientName)}</div>
        <div class="appt-detail">${svc ? esc(svc.name) + ' · ' + formatMoney(svc.price) : 'Услуга удалена'}</div>
        ${a.phone ? `<div class="appt-detail-muted">${esc(a.phone)}</div>` : ''}
        ${a.notes ? `<div class="appt-notes">${esc(a.notes)}</div>` : ''}
        ${a.source === 'client' ? `<div class="appt-detail-muted">Заявка с сайта</div>` : ''}
        ${a.reminderDate ? `<div class="appt-detail-muted">🔔 Напомнить: ${esc(new Date(a.reminderDate + 'T00:00:00').toLocaleDateString('ru-RU'))}</div>` : ''}
      </div>
      <div class="appt-right">
        <span class="status-pill" style="color:${meta.color}; background:${meta.bg};">${meta.label}</span>
        <div class="appt-actions">
          ${a.status !== 'done' ? `<button class="text-action" data-action="set-status" data-id="${a.id}" data-status="done">Выполнено</button>` : ''}
          ${a.status !== 'cancelled' ? `<button class="text-action" data-action="set-status" data-id="${a.id}" data-status="cancelled">Отменить</button>` : ''}
          <button class="text-action" data-action="edit-appt" data-id="${a.id}">Изменить</button>
          <button class="text-action" data-action="delete-appt" data-id="${a.id}">Удалить</button>
        </div>
      </div>
    </div>
  `;
}

function renderApptForm() {
  const editing = state.editingApptId ? state.appointments.find(a => a.id === state.editingApptId) : null;
  const d = editing ? editing.date : state.selectedDate;
  const t = editing ? editing.time : '10:00';
  const name = editing ? editing.clientName : '';
  const phone = editing ? editing.phone : '';
  const notes = editing ? editing.notes : '';
  const serviceOptions = state.services.map(s => `<option value="${s.id}" ${editing && editing.serviceId === s.id ? 'selected' : ''}>${esc(s.name)} — ${formatMoney(s.price)}</option>`).join('');
  return `
    <form class="form-card" id="appt-form" data-editing-id="${editing ? editing.id : ''}">
      <div class="form-grid">
        <div><label class="field-label">Дата</label><input type="date" name="date" value="${d}" required /></div>
        <div><label class="field-label">Время</label><input type="time" name="time" value="${t}" required /></div>
        <div><label class="field-label">Имя клиента</label><input type="text" name="clientName" value="${esc(name)}" placeholder="Анна Ковальчук" required /></div>
        <div><label class="field-label">Телефон</label><input type="tel" name="phone" value="${esc(phone)}" placeholder="+380 67 123 4567" required /></div>
        <div class="wide">
          <label class="field-label">Услуга</label>
          ${state.services.length === 0
            ? `<div style="font-size:13px; color:#8A7570; padding:8px 0;">Сначала добавьте услугу во вкладке «Услуги и цены»</div>`
            : `<select name="serviceId" required>${serviceOptions}</select>`}
        </div>
        <div><label class="field-label">Напомнить клиенту (дата)</label><input type="date" class="reminder-date-input" name="reminderDate" value="${editing && editing.reminderDate ? editing.reminderDate : ''}" /></div>
        <div class="wide"><label class="field-label">Заметка</label><textarea name="notes" placeholder="Аллергии, пожелания по пигменту и т.д.">${esc(notes)}</textarea></div>
      </div>
      <div class="error-text" id="appt-error" style="display:none;"></div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">${editing ? 'Сохранить' : 'Добавить запись'}</button>
        <button type="button" class="btn-secondary" data-action="cancel-appt-form">Отмена</button>
      </div>
    </form>
  `;
}

function renderClients() {
  const clients = getClients();
  if (clients.length === 0) return `<div class="empty-state"><p class="empty-title">Клиентов пока нет</p><p class="empty-body">Они появятся здесь после первой записи.</p></div>`;
  return clients.map(c => {
    const open = state.expandedClientKey === c.key;
    return `
      <div class="client-card">
        <button class="client-header" data-action="toggle-client" data-key="${esc(c.key)}">
          <div class="client-avatar">${esc((c.name || '?').trim().slice(0,1).toUpperCase() || '?')}</div>
          <div style="flex:1;">
            <div class="client-name">${esc(c.name)}</div>
            <div class="appt-detail-muted">${c.phone ? esc(c.phone) + ' · ' : ''}${c.visits.length} ${c.visits.length === 1 ? 'визит' : 'визита(ов)'}</div>
          </div>
          <div class="client-revenue">${formatMoney(c.revenue)}</div>
          <span style="opacity:.5;">${open ? '▲' : '▼'}</span>
        </button>
        ${open ? `<div class="client-history">${c.visits.map(v => {
          const svc = state.services.find(s => s.id === v.serviceId);
          const meta = STATUS_META[v.status] || STATUS_META.planned;
          return `<div class="history-row">
            <div class="history-date">${esc(new Date(v.date + 'T00:00:00').toLocaleDateString('ru-RU'))} · ${esc(v.time)}</div>
            <div class="history-service">${svc ? esc(svc.name) : 'Услуга удалена'}</div>
            <span class="status-pill" style="color:${meta.color}; background:${meta.bg};">${meta.label}</span>
            ${v.notes ? `<div class="appt-notes">${esc(v.notes)}</div>` : ''}
          </div>`;
        }).join('')}</div>` : ''}
      </div>
    `;
  }).join('');
}

function renderServices() {
  return `
    ${(!state.showServiceForm && !state.editingServiceId) ? `<button class="btn-primary" data-action="show-add-service">+ Новая услуга</button>` : ''}
    ${(state.showServiceForm || state.editingServiceId) ? renderServiceForm() : ''}
    <div style="margin-top:20px;">
      ${state.services.length === 0 && !state.showServiceForm ? `
        <div class="empty-state"><p class="empty-title">Прайс пуст</p><p class="empty-body">Добавьте услуги — они появятся и в форме для клиентов.</p></div>`
        : state.services.map(renderServiceRow).join('')}
    </div>
  `;
}

function renderServiceRow(s) {
  return `
    <div class="service-row" style="border-left-color:#E7DEDA;">
      <div style="flex:1;">
        <div class="appt-client">${esc(s.name)}</div>
        ${s.duration ? `<div class="appt-detail-muted">${esc(s.duration)} мин</div>` : ''}
      </div>
      <div class="service-price">${formatMoney(s.price)}</div>
      <div class="appt-actions">
        <button class="text-action" data-action="edit-service" data-id="${s.id}">Изменить</button>
        <button class="text-action" data-action="delete-service" data-id="${s.id}">Удалить</button>
      </div>
    </div>
  `;
}

function renderServiceForm() {
  const editing = state.editingServiceId ? state.services.find(s => s.id === state.editingServiceId) : null;
  return `
    <form class="form-card" id="service-form" data-editing-id="${editing ? editing.id : ''}">
      <div class="form-grid">
        <div class="wide"><label class="field-label">Название услуги</label><input type="text" name="name" value="${editing ? esc(editing.name) : ''}" placeholder="Перманентный макияж бровей" required /></div>
        <div><label class="field-label">Цена, грн</label><input type="number" name="price" min="0" value="${editing ? editing.price : ''}" placeholder="2500" required /></div>
        <div><label class="field-label">Длительность, мин</label><input type="number" name="duration" min="0" value="${editing && editing.duration ? editing.duration : ''}" placeholder="120" /></div>
      </div>
      <div class="error-text" id="service-error" style="display:none;"></div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">${editing ? 'Сохранить' : 'Добавить услугу'}</button>
        <button type="button" class="btn-secondary" data-action="cancel-service-form">Отмена</button>
      </div>
    </form>
  `;
}

/* ---------- events ---------- */
function attachListeners() {
  const app = document.getElementById('app');
  const datePicker = document.getElementById('date-picker');
  if (datePicker) datePicker.addEventListener('change', e => { state.selectedDate = e.target.value; render(); });
  app.addEventListener('click', onClick);
  const apptForm = document.getElementById('appt-form');
  if (apptForm) apptForm.addEventListener('submit', onApptSubmit);
  const serviceForm = document.getElementById('service-form');
  if (serviceForm) serviceForm.addEventListener('submit', onServiceSubmit);
}

function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'tab') { state.tab = el.dataset.tab; state.showAddForm = false; state.editingApptId = null; state.showServiceForm = false; state.editingServiceId = null; render(); }
  else if (action === 'prev-day') { state.selectedDate = addDaysStr(state.selectedDate, -1); render(); }
  else if (action === 'next-day') { state.selectedDate = addDaysStr(state.selectedDate, 1); render(); }
  else if (action === 'today') { state.selectedDate = todayStr(); render(); }
  else if (action === 'show-add-appt') { state.editingApptId = null; state.showAddForm = true; render(); }
  else if (action === 'cancel-appt-form') { state.showAddForm = false; state.editingApptId = null; render(); }
  else if (action === 'edit-appt') { state.showAddForm = false; state.editingApptId = el.dataset.id; render(); }
  else if (action === 'delete-appt') { db.collection('appointments').doc(el.dataset.id).delete(); }
  else if (action === 'set-status') { db.collection('appointments').doc(el.dataset.id).update({ status: el.dataset.status }); }
  else if (action === 'dismiss-reminder') { db.collection('appointments').doc(el.dataset.id).update({ reminderDate: null }); }
  else if (action === 'toggle-client') { state.expandedClientKey = state.expandedClientKey === el.dataset.key ? null : el.dataset.key; render(); }
  else if (action === 'show-add-service') { state.editingServiceId = null; state.showServiceForm = true; render(); }
  else if (action === 'cancel-service-form') { state.showServiceForm = false; state.editingServiceId = null; render(); }
  else if (action === 'edit-service') { state.showServiceForm = false; state.editingServiceId = el.dataset.id; render(); }
  else if (action === 'delete-service') { db.collection('services').doc(el.dataset.id).delete(); }
}

function onApptSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const data = {
    date: fd.get('date'),
    time: fd.get('time'),
    clientName: (fd.get('clientName') || '').trim(),
    phone: (fd.get('phone') || '').trim(),
    serviceId: fd.get('serviceId'),
    notes: (fd.get('notes') || '').trim(),
    reminderDate: fd.get('reminderDate') || null,
  };
  const errBox = document.getElementById('appt-error');
  if (!data.clientName || !data.phone || !data.date || !data.time) { errBox.textContent = 'Заполните все обязательные поля'; errBox.style.display = 'block'; return; }
  if (state.services.length === 0) { errBox.textContent = 'Сначала добавьте услугу во вкладке «Услуги и цены»'; errBox.style.display = 'block'; return; }
  const editingId = form.dataset.editingId;
  if (editingId) {
    db.collection('appointments').doc(editingId).update(data);
  } else {
    db.collection('appointments').add({ status: 'planned', source: 'master', ...data });
  }
  state.showAddForm = false; state.editingApptId = null;
  render();
}

function onServiceSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const name = (fd.get('name') || '').trim();
  const price = fd.get('price');
  const duration = fd.get('duration');
  const errBox = document.getElementById('service-error');
  if (!name) { errBox.textContent = 'Укажите название услуги'; errBox.style.display = 'block'; return; }
  if (price === '' || isNaN(Number(price)) || Number(price) < 0) { errBox.textContent = 'Укажите корректную цену'; errBox.style.display = 'block'; return; }
  const data = { name, price: Number(price), duration: duration ? Number(duration) : null };
  const editingId = form.dataset.editingId;
  if (editingId) {
    db.collection('services').doc(editingId).update(data);
  } else {
    db.collection('services').add(data);
  }
  state.showServiceForm = false; state.editingServiceId = null;
  render();
}

render();
</script>
</body>
</html>
